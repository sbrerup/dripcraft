# What every player on the creative server gets without being an operator. Copied to
# /data/config on start, and read through settings.permissions-file, set in
# creative-tuning-patches.json. axiom.default is the Axiom plugin's own set for players
# who are not operators (see README, "Axiom").
creativeacres.player:
  description: Permissions for every player
  default: true
  children:
    axiom.default: true
