apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dripcraft-public
resources:
- namespace.yaml
- minecraft.yaml
- playit.yaml
- uptime-check.yaml
- web-map.yaml
- network-policies.yaml
configMapGenerator:
- name: paper-config
  files:
  - paper-global.yml
  - player-permissions.yml
  - tuning-patches.json
- name: discord-status
  files:
  - discord-status.sh
- name: web-map
  files:
  - Caddyfile
