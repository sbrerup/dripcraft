<!doctype html>
<!-- The members' hub (see README). Caddy serves this for every address that is
     not a file, the map or the numbers, and hub.js draws the page the address
     names. player-stats.sh writes /data/stats.json, /data/skins/ and
     /data/flags/. Nothing is loaded from other sites: the skins and flags are
     copies the script fetched, and the icon is written out in this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#62b5e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060b20" media="(prefers-color-scheme: dark)">
<title>Lush Acres</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a7a3c'/%3E%3Cpath d='M16 26v-9' stroke='%23fdf6e0' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M16 18c0-5-3.5-8-9.5-8 0 5.5 3.5 8 9.5 8zM16 15c0-5 3.5-7.5 9.5-7.5 0 5.5-3.5 7.5-9.5 7.5z' fill='%23fdf6e0'/%3E%3C/svg%3E">

<script src="/hub.js" defer></script>

<body>
<header class="top">
  <a class="brand" href="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 14c0-4-2.6-6.4-7.5-6.4 0 4.4 2.6 6.4 7.5 6.4zM12 11.5c0-4 2.6-6 7.5-6 0 4.4-2.6 6-7.5 6z" fill="currentColor"/></svg>
    Lush Acres

  <nav id="nav" aria-label="Pages">
    <a href="/" data-page="home"><i class="spot"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4l8 7.2V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>

</header>
<main id="view"></main>
<footer>
  <p>Lush Acres, a little world of our own.</p>
  <p>
    The numbers are counted by the game itself, since the world's first day. Someone who is playing shows

    <a href="https://db-ip.com" rel="noopener">IP Geolocation by DB-IP</a>.
  </p>
  <p id="updated"></p>
</footer>

</html>
