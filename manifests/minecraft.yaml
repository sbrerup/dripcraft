apiVersion: v1
kind: Service
metadata:
  name: minecraft
  labels:
    app.kubernetes.io/name: minecraft
spec:
  # The playit tunnel's origin is typed into the playit dashboard, so this
  # address must stay stable across Service re-creation.
  clusterIP: 10.96.25.65
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
    # Simple Voice Chat. Has its own playit tunnel, because voice is UDP and the
    # Minecraft tunnel carries TCP only (see README).
    - name: voicechat
      port: 24454
      targetPort: voicechat
      protocol: UDP
    # Geyser, for Bedrock players. Has its own playit tunnel (see README).
    - name: bedrock
      port: 19132
      targetPort: bedrock
      protocol: UDP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  labels:
    app.kubernetes.io/name: minecraft
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 1
  serviceName: minecraft
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Room for STOP_SERVER_ANNOUNCE_DELAY and STOP_DURATION together.
      terminationGracePeriodSeconds: 210
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java25@sha256:e2fabc536673f8c6b343055c93f7a73e10caa79cd3368f645987593c65adf1e0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            # Bump VERSION and PAPER_BUILD together, after a backup.
            - name: VERSION
              value: "26.3"
            - name: PAPER_BUILD
              value: "241"
            # 4-10 players. Keep the pod limit about 4Gi above the heap: Java
            # needs about 1Gi on top of it, and the rest is file cache, which
            # counts against the limit and speeds up chunk loading.
            - name: MEMORY
              value: 6G
            - name: USE_AIKAR_FLAGS
              value: "TRUE"
            # Added to Aikar's flags, not a replacement for them.
            - name: JVM_XX_OPTS
              value: -XX:+UseTransparentHugePages -XX:+UseCompactObjectHeaders
            # Settings with no environment variable, applied on every start.
            - name: PATCH_DEFINITIONS
              value: /patches/tuning-patches.json
            # Access: online accounts on the whitelist only. Names are managed
            # with rcon-cli (see README) because this repository is public.
            - name: ONLINE_MODE
              value: "TRUE"
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            # Off because Bedrock players cannot chat while it is on. Bedrock has no
            # signed chat, so Java players' chat is no longer signed either.
            - name: ENFORCE_SECURE_PROFILE
              value: "FALSE"
            - name: HIDE_ONLINE_PLAYERS
              value: "TRUE"
            - name: ENABLE_QUERY
              value: "FALSE"
            - name: ENABLE_COMMAND_BLOCK
              value: "FALSE"
            # Reachable on loopback only: the NetworkPolicy admits 25565 alone.
            - name: ENABLE_RCON
              value: "TRUE"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: password
            # Game settings.
            # The world's folder. Changing it starts a fresh world (see README).
            - name: LEVEL
              value: dripcraft
            - name: MOTD
              value: Lush Acres
            - name: MAX_PLAYERS
              value: "10"
            - name: DIFFICULTY
              value: hard
            - name: SPAWN_PROTECTION
              value: "0"
            # The main thread is the bottleneck on this CPU: keep chunks
            # simulated close to players, and let ZFS handle write ordering.
            - name: VIEW_DISTANCE
              value: "16"
            # Keep mob-spawn-range in tuning-patches.json equal to this.
            - name: SIMULATION_DISTANCE
              value: "6"
            - name: SYNC_CHUNK_WRITES
              value: "FALSE"
            # Block log with undo, which needs NBT-API, optional voice chat, chest
            # sorting, world pre-generation from the admin panel, Bedrock players
            # through Geyser and Floodgate, tree felling and Discord chat (see README).
            - name: MODRINTH_PROJECTS
              value: nbtapi:h7feK39u,prism:K6DsX6Ko,simple-voice-chat:5OqsnSs7,chestsort-plus:Dftgf7Pm,chunky:RBuKjN4k,geyser:KmriR1ju,timberella:ubeGx8M9,discordsrv:ATlquwiT
            # Floodgate for Paper is not on Modrinth. Pinned to one build.
            - name: PLUGINS
              value: https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/spigot
            # Discord chat. Without this Secret the plugin turns itself off and the
            # server starts as normal.
            - name: DISCORDSRV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-bot
                  key: token
                  optional: true
            # Every connection must carry a PROXY header from the playit agent,
            # which is how the server sees real player addresses. mc-health
            # uses this to send the header itself.
            - name: USES_PROXY_PROTOCOL
              value: "TRUE"
            - name: STOP_DURATION
              value: "120"
            # Warns players in chat, then waits this many seconds before stopping.
            - name: STOP_SERVER_ANNOUNCE_DELAY
              value: "60"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: voicechat
              containerPort: 24454
              protocol: UDP
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          # First boot downloads Paper and generates the world.
          startupProbe:
            exec:
              command: [mc-health]
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [mc-health]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [mc-health]
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            # No CPU limit: throttling the JVM causes tick stalls. The request is
            # what this server is guaranteed on a shared node, and it can use more
            # when the node is idle. Leave 1 core unreserved on the node, because
            # firecrawl-api needs that much free to roll out an update.
            requests:
              cpu: 3400m
              memory: 10Gi
            limits:
              memory: 10Gi
          volumeMounts:
            # One folder per server on this volume. The test server from before
            # launch is still at the top of the volume, out of reach (see README).
            # The folder must exist and belong to uid 1000 before a pod starts,
            # because local-path volumes ignore fsGroup.
            - name: data
              mountPath: /data
              subPath: server
            - name: paper-config
              mountPath: /config/paper-global.yml
              subPath: paper-global.yml
              readOnly: true
            - name: paper-config
              mountPath: /config/player-permissions.yml
              subPath: player-permissions.yml
              readOnly: true
            - name: paper-config
              mountPath: /patches/tuning-patches.json
              subPath: tuning-patches.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: backup
          image: itzg/mc-backup:latest@sha256:452e5c458e1eeb7ee47ae2d4afca0cec14ce878a12b4a8311ad2586b5e6cb118
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: BACKUP_METHOD
              value: tar
            - name: BACKUP_INTERVAL
              value: 6h
            - name: INITIAL_DELAY
              value: 15m
            # A pre-generated world makes each archive large, so 2 days of them.
            - name: PRUNE_BACKUPS_DAYS
              value: "2"
            # Chunky writes to the world while it generates, which makes tar report
            # a failed backup. Pause what is running, and resume only that afterwards.
            # The wait lets chunks it loaded unload and save.
            - name: PRE_SAVE_ALL_SCRIPT
              value: |
                rcon-cli chunky progress | grep -o 'minecraft:[a-z_]*' | sort -u > /tmp/chunky-paused || true
                while read -r world; do rcon-cli chunky pause "$world" > /dev/null || true; done < /tmp/chunky-paused
                [ -s /tmp/chunky-paused ] && sleep 20
                true
            - name: POST_BACKUP_SCRIPT
              value: |
                while read -r world; do rcon-cli chunky continue "$world" > /dev/null || true; done < /tmp/chunky-paused
                : > /tmp/chunky-paused
                true
            - name: SRC_DIR
              value: /data
            - name: DEST_DIR
              value: /backups
            - name: EXCLUDES
              value: "*.jar,cache,logs,libraries,versions"
            - name: RCON_HOST
              value: localhost
            - name: RCON_PORT
              value: "25575"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: server
              readOnly: true
            - name: backups
              mountPath: /backups
            - name: backup-tmp
              mountPath: /tmp
        # Keeps a message in Discord showing whether the server is up and who is
        # playing (see README). Posts nothing until the discord-status Secret exists.
        - name: discord-status
          # Already on the node, and it has rcon-cli, curl and jq.
          image: itzg/minecraft-server:java25@sha256:e2fabc536673f8c6b343055c93f7a73e10caa79cd3368f645987593c65adf1e0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: [sh, /scripts/discord-status.sh]
          env:
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            # The message's ID is kept here, so a restart edits the same message.
            - name: data
              mountPath: /data
              subPath: server
            - name: discord-status
              mountPath: /scripts
              readOnly: true
            # Not a subPath, so a new or changed Secret reaches the container
            # without restarting the server.
            - name: discord-webhook
              mountPath: /run/discord-status
              readOnly: true
      volumes:
        - name: paper-config
          configMap:
            name: paper-config
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: backup-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: discord-status
          configMap:
            name: discord-status
        - name: discord-webhook
          secret:
            secretName: discord-status
            optional: true
  # Separate volumes rather than subPaths: local-path volumes ignore fsGroup,
  # and these restricted pods have no root init container to fix ownership.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: backups
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 50Gi
