# Copied to /data/config on start; Paper fills in everything else. Must match
# the tunnel's Proxy Protocol setting in the playit dashboard (Version 2).
proxies:
  proxy-protocol: true
# Paper chooses only 2 on this node, shared by players loading terrain and pre-generation.
chunk-system:
  worker-threads: 4
# Allows attribute swapping: a hit right after switching weapons still uses the
# previous weapon's attributes, as in vanilla. Paper blocks it unless this is off.
unsupported-settings:
  update-equipment-on-player-actions: false
