# The tunnel's origin is set in the playit dashboard, so the agent could be
# pointed anywhere it can reach, and the server takes connections from the
# internet. No pod here may reach the LAN, the tailnet or the rest of the
# cluster. IPv6 egress is denied entirely.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  policyTypes: [Ingress]
  ingress:
    # Game, voice and Bedrock ports only. RCON stays on the pod's loopback.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: playit-agent
      ports:
        - {protocol: TCP, port: 25565}
        - {protocol: UDP, port: 24454}
        - {protocol: UDP, port: 19132}
    # squaremap's web server, for the web map's proxy only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-map
      ports:
        - {protocol: TCP, port: 8080}
    # The same web server, for the archive, which asks it who is on the map.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: archive
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Mojang authentication and Paper/plugin downloads: HTTPS only.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft-creative-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minecraft-creative
  policyTypes: [Ingress]
  ingress:
    # Game and Bedrock ports only. RCON stays on the pod's loopback, and the two
    # servers cannot reach each other.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: playit-agent
      ports:
        - {protocol: TCP, port: 25565}
        - {protocol: UDP, port: 19132}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft-creative-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minecraft-creative
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Mojang authentication, Paper/plugin downloads and Discord: HTTPS only.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: playit-agent-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: playit-agent
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minecraft
      ports:
        - {protocol: TCP, port: 25565}
        - {protocol: UDP, port: 24454}
        - {protocol: UDP, port: 19132}
    # The creative server's Java and Bedrock tunnels.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minecraft-creative
      ports:
        - {protocol: TCP, port: 25565}
        - {protocol: UDP, port: 19132}
    # The web map's HTTPS tunnel, to Caddy's HTTP and HTTPS ports.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-map
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
    # playit's API and tunnel servers, over TCP and UDP on ports it chooses.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
---
