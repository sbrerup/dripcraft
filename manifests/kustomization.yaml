apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dripcraft-public
resources:
- namespace.yaml
- minecraft.yaml
- creative.yaml
- playit.yaml
- uptime-check.yaml
- web-map.yaml
- archive.yaml
- network-policies.yaml
configMapGenerator:
- name: paper-config
  files:
  - paper-global.yml
  - player-permissions.yml
  - tuning-patches.json
# The creative server's own copies, under the names its pod mounts them by.
- name: creative-config
  files:
  - paper-global.yml=creative-paper-global.yml
  - tuning-patches.json=creative-tuning-patches.json
- name: discord-status
  files:
  - discord-status.sh
- name: web-map
  files:
  - Caddyfile
- name: archive
  files:
  - archive.py
- name: player-stats
  files:
  - player-stats.sh
  - index.html=hub.html
  - hub.css
  - hub.js
  - fraunces.woff2
  - figtree.woff2
